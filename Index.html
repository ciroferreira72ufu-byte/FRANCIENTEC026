        let currentScore = 0;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `<button class="option-btn" onclick="checkAnswer(${index}, ${optIdx}, this)">${String.fromCharCode(65 + optIdx)}) ${opt}</button>`;
                });

                card.innerHTML = `
                    <span class="category-tag">${q.category}</span>
                    <div class="question-text">${index + 1}. ${q.question}</div>
                    <div class="options" id="options-${index}">${optionsHTML}</div>
                    <div class="feedback" id="feedback-${index}"></div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(qIdx, selectedOpt, btn) {
            const optionsContainer = document.getElementById(`options-${qIdx}`);
            const feedbackEl = document.getElementById(`feedback-${qIdx}`);
            const q = questions[qIdx];

            // Deshabilitar botones de esta pregunta
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selectedOpt === q.correct) {
                btn.style.backgroundColor = '#48bb78';
                btn.style.color = 'white';
                feedbackEl.className = 'feedback correct';
                feedbackEl.innerHTML = `<strong>¡Correcto!</strong> ${q.explanation}`;
                currentScore++;
                document.getElementById('score').innerText = currentScore;
            } else {
                btn.style.backgroundColor = '#f56565';
                btn.style.color = 'white';
                // Resaltar respuesta correcta
                buttons[q.correct].style.backgroundColor = '#48bb78';
                buttons[q.correct].style.color = 'white';

                feedbackEl.className = 'feedback incorrect';
                feedbackEl.innerHTML = `<strong>Incorrecto.</strong> La respuesta correcta era la opción ${String.fromCharCode(65 + q.correct)}. <br>${q.explanation}`;
            }
            feedbackEl.style.display = 'block';
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
